workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 120
    environment:
      java: 11
      node: 18
    scripts:
      - name: Install dependencies
        script: |
          cd vdairy
          npm install
      - name: Build web app
        script: |
          cd vdairy
          npm run build
      - name: Sync Capacitor
        script: |
          cd vdairy
          npx cap sync android
      - name: Build APK
        script: |
          cd vdairy/android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - vdairy/android/app/build/outputs/apk/release/app-release-unsigned.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
