workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 120
    environment:
      java: 11
      node: 18
      ndk: 23.1.8779455
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/app-release-unsigned.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
