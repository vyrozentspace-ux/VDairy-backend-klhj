workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 120
    instance_type: linux
    environment:
      groups:
        - android_signing
      java: default
      ndk: 23.1.8779455
    scripts:
      - name: Install dependencies
        script: |
          bun install
      - name: Build web app
        script: |
          cd vdairy
          bun install
          bun run build
      - name: Sync Capacitor
        script: |
          cd vdairy
          npx cap sync android
      - name: Build APK
        script: |
          cd vdairy/android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - vdairy/android/app/build/outputs/apk/release/app-release-unsigned.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
